    <style>
      /* Riserva lo spazio dell'hero PRIMA che React monti: nessun salto, nessun
         blocco vuoto. Il colore di fondo è già quello definitivo. */
      html { background: #0b0b0f; }
      /* `clip` e non `hidden`: `overflow-x: hidden` renderebbe il body un
         contenitore che scorre da solo e window.scrollTo smetterebbe di
         funzionare, rompendo tutti i link alle sezioni. */
      body { margin: 0; background: #0b0b0f; overflow-x: clip; }
      #root { min-height: 100svh; }
      #avvio {
        min-height: 100svh;
        background: #0b0b0f url('/poster/v01-hero.webp') center / cover no-repeat;
      }
      #avvio::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(to top, #0b0b0f 0%, rgba(11,11,15,.72) 38%, rgba(11,11,15,.45) 100%);
      }
    </style>
