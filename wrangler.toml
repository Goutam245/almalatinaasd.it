# Configurazione Cloudflare Workers.
#
# La riga che risolve il 404 su /admin è `not_found_handling`.
# Quando l'indirizzo richiesto non corrisponde a un file dentro dist/,
# Cloudflare serve index.html con stato 200 invece di rispondere
# «non trovato»; poi il router del browser mostra la pagina giusta.
#
# Questo file serve al deploy su Workers. Su Cloudflare Pages lo stesso
# lavoro lo fa public/_redirects, che resta valido in parallelo: tenerli
# entrambi non crea conflitti.

name = "almalatinaasd"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
